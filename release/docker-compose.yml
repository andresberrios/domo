# Domo infra stack for a host install (initial-design.md Decided #19).
#
# Only the session-runtime infra is containerised — the Domo app itself
# runs on the host (it orchestrates host-side `claude` / git / Coast;
# Decided #11). The `domo` CLI manages this stack for you (`domo up`).
#
#   postgres       — agents-server's control-plane store ONLY. Domo's own
#                    project/env/session metadata is host SQLite at
#                    $DOMO_HOME/state.db.
#   agents-server  — @electric-ax/agents-server, built from a pinned
#                    Dockerfile (no repo bind mount, unlike the dev compose).
#                    Durable streams run EMBEDDED.
#
# Storage: ALL data lives under $DOMO_HOME (bind-mounted via DOMO_DATA_DIR,
# set by the `domo` CLI) — Postgres and the durable streams included — so
# the whole install is one dir to back up (`tar` $DOMO_HOME) or wipe
# (`rm -rf` $DOMO_HOME). No Docker named volumes.
#
# Postgres is NOT published to the host: only agents-server talks to it,
# over the compose network (`postgres:5432`), and the Domo app never
# touches Postgres (Decided #14, host SQLite). So there is no host port to
# clash with a Postgres the user may already run. agents-server's ports
# are localhost-only and overridable (the host app connects to :4437).
name: domo

services:
  postgres:
    image: postgres:16-alpine
    # Run as the host user so the bind-mounted data is host-owned —
    # otherwise `rm -rf`/`tar` of $DOMO_HOME fails (root-owned). The CLI
    # pre-creates the dirs owned by this uid; the official image runs
    # initdb as that uid when started non-root.
    user: '${DOMO_UID:?set by the domo CLI}:${DOMO_GID:?set by the domo CLI}'
    environment:
      POSTGRES_DB: electric_agents
      POSTGRES_USER: electric_agents
      POSTGRES_PASSWORD: electric_agents
    volumes:
      - '${DOMO_DATA_DIR:?set by the domo CLI}/postgres:/var/lib/postgresql/data'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U electric_agents -d electric_agents']
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  agents-server:
    build:
      context: .
      dockerfile: Dockerfile.agents-server
    image: domo-agents-server:local
    # Same: writes /streams-data (bind-mounted) as the host user. node
    # only reads the image's /app and writes the host-owned mount.
    user: '${DOMO_UID:?set by the domo CLI}:${DOMO_GID:?set by the domo CLI}'
    environment:
      ELECTRIC_AGENTS_DATABASE_URL: postgresql://electric_agents:electric_agents@postgres:5432/electric_agents
      ELECTRIC_AGENTS_HOST: 0.0.0.0
      ELECTRIC_AGENTS_PORT: '4437'
      ELECTRIC_AGENTS_STREAMS_HOST: 0.0.0.0
      ELECTRIC_AGENTS_STREAMS_PORT: '4438'
      ELECTRIC_AGENTS_STREAMS_DATA_DIR: /streams-data
    ports:
      - '127.0.0.1:${DOMO_AGENTS_PORT:-4437}:4437'
      - '127.0.0.1:${DOMO_AGENTS_STREAMS_PORT:-4438}:4438'
    volumes:
      - '${DOMO_DATA_DIR:?set by the domo CLI}/streams:/streams-data'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
