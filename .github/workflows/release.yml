# Builds a release of Domo on each platform and, when asked, publishes it
# with its manifest to the public releases repository, which holds no source.
# Installs read it anonymously (bin/domo.mjs, `feed()`). See
# docs/install-and-updates.md. The releases repository's README is
# .github/releases-repo/README.md.
#
# Releases are built and published on Andrés's Mac for now
# (`pnpm release:publish`), so this runs only by hand. It is kept for when CI
# moves to Blacksmith: each platform's runner is a repository variable
# (DOMO_LINUX_X64_RUNNER, DOMO_LINUX_ARM64_RUNNER, DOMO_MACOS_RUNNER), so that
# move is setting them to Blacksmith's labels; unset, they are GitHub's. When
# it publishes, `release` is pushed after it, never before (see
# scripts/publish-release.mjs).
#
# Needs the secret DOMO_RELEASES_TOKEN: a fine-grained token with
# "Contents: read and write" on andresberrios/domo-releases only. A
# self-hosted Apple silicon Mac as DOMO_MACOS_RUNNER builds darwin-x64 under
# Rosetta.
name: release

on:
  # Builds every platform, and publishes only when asked, so the builds can be
  # checked without releasing anything.
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the release
        type: boolean
        default: false

# One publish at a time: each manifest builds on the last.
concurrency:
  group: release
  cancel-in-progress: false

env:
  RELEASES_REPO: andresberrios/domo-releases

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { runner: "${{ vars.DOMO_LINUX_X64_RUNNER || 'ubuntu-24.04' }}", platform: linux-x64, node-arch: x64 }
          - { runner: "${{ vars.DOMO_LINUX_ARM64_RUNNER || 'ubuntu-24.04-arm' }}", platform: linux-arm64, node-arch: arm64 }
          - { runner: "${{ vars.DOMO_MACOS_RUNNER || 'macos-15' }}", platform: darwin-arm64, node-arch: arm64 }
          # An x64 Node: on Apple silicon it runs under Rosetta, and pnpm picks
          # the x64 packages for the process's architecture.
          - { runner: "${{ vars.DOMO_MACOS_RUNNER || 'macos-15-intel' }}", platform: darwin-x64, node-arch: x64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Tool versions
        id: tools
        run: |
          echo "node=$(awk '$1 == "nodejs" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"
          echo "pnpm=$(awk '$1 == "pnpm" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.tools.outputs.pnpm }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ steps.tools.outputs.node }}
          architecture: ${{ matrix.node-arch }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/release.mjs build --out dist --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.platform }}
          path: dist/domo-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: inputs.publish
    runs-on: ubuntu-24.04
    steps:
      # The whole history: the manifest lists the commits since the last release.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Manifest
        id: manifest
        run: |
          curl -fsSL "https://github.com/$RELEASES_REPO/releases/latest/download/manifest.json" -o previous.json || rm -f previous.json
          node scripts/release.mjs manifest --out dist --previous previous.json
          echo "version=$(node scripts/release.mjs version)" >> "$GITHUB_OUTPUT"
          git log -1 --format='%s%n%n%b' > notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.DOMO_RELEASES_TOKEN }}
          VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          cd dist
          # A draft until every file is up: installs follow `latest`, which must never lack one.
          gh release create "v$VERSION" --repo "$RELEASES_REPO" --title "Domo $VERSION" --notes-file ../notes.md --draft \
            manifest.json SHA256SUMS domo.mjs install.sh domo-*.tar.gz
          gh release edit "v$VERSION" --repo "$RELEASES_REPO" --draft=false --latest
