name: release

# Tag a version → build the host app tarball + installer and attach them
# to the GitHub release. See initial-design.md "Distribution & release".
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    # linux-x64: native modules (better-sqlite3) make the tarball
    # platform-specific — this must match the supported install target.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build release artifacts
        run: bash scripts/build-release.sh "${GITHUB_REF_NAME}"

      - name: Create / update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" \
                 --title "${GITHUB_REF_NAME}" \
                 --generate-notes
          gh release upload "${GITHUB_REF_NAME}" \
            dist/domo-linux-x64.tar.gz dist/install.sh dist/SHA256SUMS \
            --clobber
