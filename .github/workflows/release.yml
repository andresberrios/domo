name: release

# Tag a version → build the host app tarball for each supported platform
# and attach them (+ installer + checksums) to the GitHub release.
# See initial-design.md "Distribution & release".
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    # One tarball per OS/arch — native better-sqlite3 is bundled into
    # .output, so each must be built on a matching runner.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runs-on: ubuntu-latest
          - platform: linux-arm64
            runs-on: ubuntu-24.04-arm
          - platform: darwin-arm64
            runs-on: macos-14
          - platform: darwin-x64
            runs-on: macos-13
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build ${{ matrix.platform }} artifact
        run: bash scripts/build-release.sh "${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: tarball-${{ matrix.platform }}
          path: dist/domo-${{ matrix.platform }}.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: tarball-*
          path: dist
          merge-multiple: true
      - name: Assemble release assets
        run: |
          cp scripts/install.sh dist/install.sh
          ( cd dist && sha256sum domo-*.tar.gz install.sh >SHA256SUMS )
          ls -lh dist && cat dist/SHA256SUMS
      - name: Create / update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" \
                 --title "${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" \
            dist/domo-*.tar.gz dist/install.sh dist/SHA256SUMS --clobber
