# Native builds that need install scripts to run. pnpm 11 blocks by
# default (supply-chain safety) — listing them here is the per-package
# allowlist. Keep narrow: every entry is a deliberate trust statement.
allowBuilds:
  '@parcel/watcher': true
  better-sqlite3: true
  esbuild: true
  unrs-resolver: true
  vue-demi: true
