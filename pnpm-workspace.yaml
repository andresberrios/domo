allowBuilds:
  '@google/genai': false
  '@opencode/cli': true
  esbuild: true
  onnxruntime-node: false
  protobufjs: false
  sharp: false
  unrs-resolver: true
  vue-demi: true
# codex-acp asks for `^0.160.1`, which would install a second Codex beside the
# top-level one. One Codex, the same as `ADAPTER_OVERRIDES` in
# server/lib/dev-env/runtime-volume.ts gives container sessions.
overrides:
  '@openai/codex': 0.162.1
minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@4.0.82'
  - '@ai-sdk/provider-utils@5.0.41'
  - '@ai-sdk/provider@4.0.15'
  - '@opencode/cli-darwin-arm64@2.0.29'
  - '@opencode/cli-darwin-x64-baseline@2.0.29'
  - '@opencode/cli-darwin-x64@2.0.29'
  - '@opencode/cli-linux-arm64-musl@2.0.29'
  - '@opencode/cli-linux-arm64@2.0.29'
  - '@opencode/cli-linux-x64-baseline-musl@2.0.29'
  - '@opencode/cli-linux-x64-baseline@2.0.29'
  - '@opencode/cli-linux-x64-musl@2.0.29'
  - '@opencode/cli-linux-x64@2.0.29'
  - '@opencode/cli-windows-arm64@2.0.29'
  - '@opencode/cli-windows-x64-baseline@2.0.29'
  - '@opencode/cli-windows-x64@2.0.29'
  - '@opencode/cli@2.0.29'
  - '@types/node@22.20.3'
  - ai@7.0.102
  - '@agentclientprotocol/claude-agent-acp@0.90.0'
  - '@agentclientprotocol/sdk@1.8.0'
  - '@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.296'
  - '@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.296'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.296'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.296'
  - '@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.296'
  - '@anthropic-ai/claude-agent-sdk-linux-x64@0.3.296'
  - '@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.296'
  - '@anthropic-ai/claude-agent-sdk-win32-x64@0.3.296'
  - '@anthropic-ai/claude-agent-sdk@0.3.296'
  - '@agentclientprotocol/codex-acp@2.2.2'
  - '@openai/codex@0.162.1-darwin-arm64 || 0.162.1-darwin-x64 || 0.162.1-linux-arm64 || 0.162.1-linux-x64 || 0.162.1-win32-arm64 || 0.162.1-win32-x64 || 0.162.1'
